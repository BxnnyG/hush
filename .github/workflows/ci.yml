name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang libclang-dev pkg-config \
            libpipewire-0.3-dev libspa-0.2-dev \
            libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev \
            libayatana-appindicator3-dev librsvg2-dev libssl-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - uses: Swatinem/rust-cache@v2

      - name: Frontend
        working-directory: ui
        run: |
          npm ci
          npm run check
          npm run build

      - name: Format
        run: cargo fmt --all -- --check

      # The DeepFilterNet model fails to load with debug assertions on, so everything that
      # touches it is built in release mode. Ubuntu has no webrtc-audio-processing-2, so CI
      # builds without the optional echo canceller (it is built and tested on Arch).
      - name: Clippy
        run: cargo clippy --release --workspace --all-targets --no-default-features -- -D warnings

      - name: Tests
        run: cargo test --release --workspace --no-default-features
