[package]
name = "hush-core"
description = "Hush core: settings, DSP chain and DeepFilterNet wrapper"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
default = []
# Acoustic echo cancellation (WebRTC AEC3). Needs the system library webrtc-audio-processing-2.
echo = ["dep:webrtc-audio-processing", "dep:webrtc-audio-processing-config"]
# Same, but builds WebRTC audio processing from the bundled source (needs meson and ninja).
# Used for release packages on distros that do not ship webrtc-audio-processing-2.
echo-bundled = ["echo", "webrtc-audio-processing/bundled"]

[dependencies]
anyhow.workspace = true
serde.workspace = true
toml.workspace = true
serde_json = "1"
log.workspace = true
thiserror.workspace = true
ndarray = "0.15"
webrtc-audio-processing = { version = "2.1", optional = true }
webrtc-audio-processing-config = { version = "2.1", optional = true }
deep_filter = { git = "https://github.com/Rikorose/DeepFilterNet", rev = "d375b2d8309e0935d165700c91da9de862a99c31", default-features = false, features = ["tract", "default-model"] }

# libDF (git) is written against tract 0.21.4; newer 0.21.x releases break its build.
# These pins only exist to force resolution, hush-core does not use tract directly.
tract-core = "=0.21.4"
tract-data = "=0.21.4"
tract-hir = "=0.21.4"
tract-linalg = "=0.21.4"
tract-nnef = "=0.21.4"
tract-onnx = "=0.21.4"
tract-onnx-opl = "=0.21.4"
tract-pulse = "=0.21.4"
tract-pulse-opl = "=0.21.4"

[dev-dependencies]
env_logger.workspace = true
